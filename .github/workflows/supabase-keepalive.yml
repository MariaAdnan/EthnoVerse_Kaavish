name: Keep Supabase awake

# Supabase free-tier projects pause after 7 days without database activity.
# The main keep-alive is the Netlify Scheduled Function in
# website/netlify/functions/keep-supabase-awake.mjs; this workflow is a backup.
# Reading one row every 3 days keeps EthnoVerse's database awake. The URL and
# publishable key are the same public values the website ships to browsers;
# override them with repository variables if the project changes.

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: read
  # Lets the job re-enable this workflow so GitHub's 60-day inactivity rule
  # (scheduled workflows are switched off in repos without commits) doesn't stop it.
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://dstropmznqaadsyhojvb.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Xi4CoXyQFxJ30oFH1J_waA_LyedCOqx' }}
    steps:
      - name: Query the database
        run: |
          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            --retry 3 --retry-delay 20 --max-time 30 \
            "$SUPABASE_URL/rest/v1/communities?select=community_id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY")
          echo "Supabase responded with HTTP $status"
          if [ "$status" != "200" ]; then
            cat response.json
            echo "::error::Supabase did not respond normally. If the project is paused, resume it in the Supabase dashboard."
            exit 1
          fi
      - name: Keep this schedule enabled without new commits
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
